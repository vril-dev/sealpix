version: 2

# Dependabot は main 宛てに更新のプルリクエストを作る。自動ではマージしないので、内容を確認してから手動でマージする。
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Tokyo

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Tokyo
